<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CODE / PAPER LAB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair;
font-family:"Cascadia Mono","SF Mono",ui-monospace,Consolas,Menlo,monospace;color:#cfd9e8}
#stage{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#trail{mix-blend-mode:screen}
#front{mix-blend-mode:screen}
#glow{mix-blend-mode:screen;filter:blur(5px) saturate(1.4) brightness(1.15);opacity:.3}
#halo{mix-blend-mode:screen;filter:blur(30px) saturate(1.15);opacity:.14}
/* ---- top bar ---- */
#bar{position:absolute;left:0;right:0;top:0;height:42px;display:flex;align-items:center;gap:24px;
padding:0 18px;z-index:9;pointer-events:none;
background:linear-gradient(180deg,rgba(4,6,10,.9),rgba(4,6,10,0))}
#bar .ttl{font-size:11px;letter-spacing:.26em;color:#eef4fb;white-space:nowrap;
text-shadow:0 0 14px rgba(160,205,255,.75)}
#bar .ttl s{text-decoration:none;color:#8ea3bd}
#bar .st{display:flex;flex-direction:column;gap:2px;min-width:50px}
#bar .st span{font-size:6.5px;letter-spacing:.24em;color:#66798f}
#bar .st em{font-style:normal;font-size:11px;color:#e6eefa;letter-spacing:.08em;
text-shadow:0 0 10px rgba(170,210,255,.6)}
#bar .fill{flex:1}
#bar .pb{width:200px;height:5px;background:rgba(160,180,210,.14);position:relative;overflow:hidden}
#bar .pb i{position:absolute;top:0;bottom:0;left:0;width:34%;background:#f2f7ff;
box-shadow:0 0 14px rgba(200,225,255,.95)}
/* ---- frame furniture ---- */
.tick{position:absolute;width:18px;height:18px;border:1px solid rgba(170,200,235,.5);z-index:9;
box-shadow:0 0 10px rgba(120,170,230,.3)}
.tick.tl{left:13px;top:13px;border-right:0;border-bottom:0}
.tick.tr{right:13px;top:13px;border-left:0;border-bottom:0}
.tick.bl{left:13px;bottom:13px;border-right:0;border-top:0}
.tick.br{right:13px;bottom:13px;border-left:0;border-top:0}
.tag{position:absolute;z-index:9;font-size:7px;letter-spacing:.34em;color:#7f96b3;pointer-events:none;
text-shadow:0 0 8px rgba(0,0,0,.9)}
.tag b{color:#cfe0f5;font-weight:400}
.t1{left:20px;bottom:52px}
.t2{right:20px;bottom:52px;text-align:right}
.t3{right:20px;top:62px;text-align:right}
/* ---- overlays ---- */
.scan{position:absolute;inset:0;pointer-events:none;z-index:10;opacity:.55;
background:repeating-linear-gradient(180deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
.vig{position:absolute;inset:0;pointer-events:none;z-index:10;
background:radial-gradient(120% 110% at 44% 46%,transparent 30%,rgba(0,0,0,.42) 68%,rgba(0,0,0,.92) 100%)}
.ab{position:absolute;inset:0;pointer-events:none;z-index:11;mix-blend-mode:screen;opacity:.5;
background:linear-gradient(90deg,rgba(255,60,40,.05),transparent 22%,transparent 78%,rgba(60,120,255,.06))}
.grain{position:absolute;inset:-50%;pointer-events:none;z-index:11;opacity:.06;
mix-blend-mode:overlay;width:200%;height:200%}
#flash{position:absolute;inset:0;pointer-events:none;z-index:12;opacity:0;
background:radial-gradient(60% 60% at 30% 48%,rgba(220,238,255,.5),rgba(150,190,255,0) 70%)}
@media (max-width:760px){#bar{gap:12px;padding:0 10px}#bar .pb{width:80px}.tag{display:none}}
</style></head><body>
<div id="stage">
<canvas id="trail"></canvas>
<canvas id="main"></canvas>
<canvas id="front"></canvas>
<canvas id="glow"></canvas>
<canvas id="halo"></canvas>
<div id="bar">
  <div class="ttl">CODE <s>/</s> PAPER LAB</div>
  <div class="st"><span>TASKS</span><em id="v-tasks">64</em></div>
  <div class="st"><span>AGENTS</span><em id="v-agents">12</em></div>
  <div class="st"><span>NETWORK</span><em id="v-net">11</em></div>
  <div class="st"><span>REV SCORES</span><em id="v-rev">28</em></div>
  <div class="fill"></div>
  <div class="pb"><i id="v-pb"></i></div>
</div>
<div class="tick tl"></div><div class="tick tr"></div><div class="tick bl"></div><div class="tick br"></div>
<div class="tag t1">MESH <b id="g1">0x3F7</b> · 网络核心</div>
<div class="tag t2">STREAM <b id="g2">4.7</b> GB/S · 数据流</div>
<div class="tag t3">WARP <b id="g3">1.00</b>x</div>
<div id="flash"></div>
<div class="ab"></div><div class="scan"></div><div class="vig"></div>
<canvas class="grain" id="grain"></canvas>
</div>
<script>
(function(){
"use strict";
var TAU=Math.PI*2,DPR=Math.min(1.5,window.devicePixelRatio||1);
function cv(id){var e=document.getElementById(id);return [e,e.getContext("2d")];}
var TR=cv("trail"),MN=cv("main"),FR=cv("front"),GL=cv("glow"),HL=cv("halo");
var trc=TR[1],mnc=MN[1],frc=FR[1],glc=GL[1],hlc=HL[1];
var W=0,H=0,CX=0,CY=0,R=0,BW=0,RIN=0,ROUT=0;
var time=0,last=0,seed=770031,pulse=0,warp=1,charge=0;
var par={x:0,y:0,tx:0,ty:0};
function rnd(){seed=(seed*1664525+1013904223)&0x7fffffff;return seed/0x7fffffff;}
function rr(a,b){return a+(b-a)*rnd();}
var flashEl=document.getElementById("flash");

/* ================= streak curtain (outside the band) ================= */
var parts=[],COLS5=["255,176,152","250,198,218","214,182,255","168,204,255","246,249,255"];
function buildParts(){
  parts.length=0;
  var n=Math.round(Math.min(620,W*H/1700)),i;
  for(i=0;i<n;i++)parts.push(newPart(true));
}
function newPart(init){
  var t=rnd(),a=rnd()*TAU;
  if(rnd()<.88)a=rr(-.46,.46); else a=rr(-.8,.8);
  return {a:a,r:ROUT+rr(1,Math.max(140,R*1.1)),
    v:rr(.9,2.6)*(rnd()<.22?3.2:1),
    len:rr(.7,2.4),
    w:rnd()<.1?rr(1.5,3.4):rr(.5,1.2),
    al:rr(.18,1),ci:t<.16?0:(t<.3?1:(t<.42?2:(t<.6?3:4)))};
}
function drawTrail(dt){
  trc.globalCompositeOperation="destination-out";
  trc.fillStyle="rgba(0,0,0,"+(1-Math.pow(.8,dt*60)).toFixed(3)+")";
  trc.fillRect(0,0,W,H);
  trc.save();
  trc.beginPath();
  trc.arc(CX+par.x*10,CY+par.y*10,ROUT+1,0,TAU);
  trc.clip();
  trc.globalCompositeOperation="destination-out";
  trc.fillStyle="#000";trc.fillRect(0,0,W,H);
  trc.restore();
  trc.globalCompositeOperation="lighter";
  trc.lineCap="butt";
  var ox=CX+par.x*10,oy=CY+par.y*10,rMax=R+BW+Math.hypot(W,H)*1.2;
  var spd=warp*(1+pulse*1.2),i,cc,tt;
  var bucket=[[new Path2D(),new Path2D(),new Path2D()],
              [new Path2D(),new Path2D(),new Path2D()],
              [new Path2D(),new Path2D(),new Path2D()],
              [new Path2D(),new Path2D(),new Path2D()],
              [new Path2D(),new Path2D(),new Path2D()]];
  for(i=0;i<parts.length;i++){
    var p=parts[i];
    var r1=p.r+p.v*spd*(120+300*(p.r/rMax))*dt;
    var tl=p.len*(1+spd*.5)*Math.max(50,r1-ROUT);
    var r0=Math.max(ROUT+1,r1-tl);
    var ca=Math.cos(p.a),sa=Math.sin(p.a);
    var fo=Math.max(0,1-r1/rMax);
    var x0=ox+ca*r0,y0=oy+sa*r0,x1=ox+ca*r1,y1=oy+sa*r1;
    var tier=p.al<.4?0:(p.al<.7?1:2);
    var bp=bucket[p.ci][tier];
    bp.moveTo(x0,y0);bp.lineTo(x1,y1);
    p.r=r1;
    if(r1>rMax||r1<=r0)parts[i]=newPart(false);
  }
  var TIERS=[.07,.17,.36];
  for(cc=0;cc<5;cc++)for(tt=0;tt<3;tt++){
    trc.strokeStyle="rgba("+COLS5[cc]+","+(TIERS[tt]*(.75+warp*.25)).toFixed(3)+")";
    trc.lineWidth=.5+tt*.45;
    trc.stroke(bucket[cc][tt]);
  }
}

/* ================= hair ball inside the band ================= */
var ballTex=null,ballTex2=null;
function buildBall(){
  ballTex=makeBall(.9);
  ballTex2=makeBall(1.7);
}
function makeBall(salt){
  var bs=.7,S=Math.round(RIN*2*bs);
  var bt=document.createElement("canvas");bt.width=S;bt.height=S;
  var c=bt.getContext("2d");
  seed=Math.floor(salt*99991)+770031;
  c.setTransform(bs,0,0,bs,0,0);
  c.translate(RIN,RIN);
  c.globalCompositeOperation="lighter";
  var i,n=Math.round(RIN*6.4);
  for(i=0;i<n;i++){
    var a1=rnd()*TAU,a2=a1+rr(1.4,4.4);
    var r1=RIN*rr(.12,1),r2=RIN*rr(.12,1);
    c.strokeStyle="rgba(253,254,255,"+rr(.08,.4).toFixed(3)+")";
    c.lineWidth=rnd()<.14?rr(.8,1.5):rr(.32,.62);
    c.beginPath();
    c.moveTo(Math.cos(a1)*r1,Math.sin(a1)*r1);
    c.quadraticCurveTo(rr(-RIN,RIN)*.7,rr(-RIN,RIN)*.7,Math.cos(a2)*r2,Math.sin(a2)*r2);
    c.stroke();
  }
  for(i=0;i<n*.35;i++){
    var oa=rnd()*TAU,or0=RIN*rr(0,.1),oe=oa+rr(-.6,.6),or1=RIN*rr(.25,.6);
    c.strokeStyle="rgba(252,253,255,"+rr(.1,.34).toFixed(3)+")";
    c.lineWidth=rr(.4,.9);
    c.beginPath();
    c.moveTo(Math.cos(oa)*or0,Math.sin(oa)*or0);
    c.lineTo(Math.cos(oe)*or1,Math.sin(oe)*or1);
    c.stroke();
  }
  /* tight inner tangle: short bright chords near the core */
  for(i=0;i<n*.7;i++){
    var b1=rnd()*TAU,b2=b1+rr(1.2,3.2);
    var br1=RIN*rr(.02,.5),br2=RIN*rr(.2,.72);
    c.strokeStyle="rgba(255,255,255,"+rr(.1,.5).toFixed(2)+")";
    c.lineWidth=rr(.4,.9);
    c.beginPath();
    c.moveTo(Math.cos(b1)*br1,Math.sin(b1)*br1);
    c.quadraticCurveTo(rr(-RIN,RIN)*.4,rr(-RIN,RIN)*.4,Math.cos(b2)*br2,Math.sin(b2)*br2);
    c.stroke();
  }
  var cg=c.createRadialGradient(0,0,0,0,0,RIN*.15);
  cg.addColorStop(0,"rgba(255,255,255,.95)");
  cg.addColorStop(.4,"rgba(236,246,255,.3)");
  cg.addColorStop(1,"rgba(200,225,255,0)");
  c.fillStyle=cg;c.beginPath();c.arc(0,0,RIN*.15,0,TAU);c.fill();
  for(i=0;i<340;i++){
    var da=rnd()*TAU,dr=RIN*Math.sqrt(rnd());
    c.fillStyle="rgba(255,255,255,"+rr(.2,.9).toFixed(2)+")";
    var sz=rnd()<.18?rr(1.4,2.4):rr(.6,1.1);
    c.fillRect(Math.cos(da)*dr,Math.sin(da)*dr,sz,sz);
  }

  var vg=c.createRadialGradient(0,0,RIN*.88,0,0,RIN);
  vg.addColorStop(0,"rgba(0,0,0,1)");vg.addColorStop(.6,"rgba(0,0,0,.7)");vg.addColorStop(1,"rgba(0,0,0,0)");
  c.globalCompositeOperation="destination-in";
  c.fillStyle=vg;c.beginPath();c.arc(0,0,RIN,0,TAU);c.fill();
  return bt;
}

/* ================= band texture: dot-matrix blocks ================= */
var bandTex=null,bandCtx=null,bandS=0,cells=[],COLS=0,ROWS=0,BS=.72;
var HEX="0123456789ABCDEF".split("");
function buildBand(){
  bandS=Math.round((ROUT+8)*2);
  bandTex=document.createElement("canvas");
  bandTex.width=Math.round(bandS*BS);bandTex.height=Math.round(bandS*BS);
  bandCtx=bandTex.getContext("2d");
  bandCtx.setTransform(BS,0,0,BS,0,0);
  COLS=Math.max(46,Math.round(TAU*R/22));
  ROWS=3;
  cells=[];
  var i,r;
  for(i=0;i<COLS;i++){
    var col=[];
    for(r=0;r<ROWS;r++){
      var t=rnd();
      var kind=t<.58?"matrix":(t<.7?"bars":(t<.78?"text":(t<.84?"tick":"empty")));
      col.push({kind:kind});
    }
    cells.push(col);
  }
  for(i=0;i<COLS;i++)for(r=0;r<ROWS;r++)paintCell(i,r);
}
function cellGeom(i,r){
  return {a:i/COLS*TAU,rm:RIN+BW*((r+.5)/ROWS)};
}
function paintCell(i,r){
  var c=cells[i][r],g=cellGeom(i,r);
  var arcW=TAU*g.rm/COLS;
  bandCtx.save();
  bandCtx.translate(bandS/2,bandS/2);
  bandCtx.rotate(g.a);
  bandCtx.translate(g.rm,0);
  var h=BW/ROWS*.84,w=arcW*.86;
  if(c.kind==="matrix"){
    var pr=h*rr(.32,.86),pw=w*rr(.5,.94);
    var px=-h/2+rnd()*(h-pr),py=-w/2+rnd()*(w-pw);
    var rows=Math.max(2,Math.round(pr/3)),cols=Math.max(6,Math.round(pw/2));
    var gapX=pw/cols,gapY=pr/rows;
    var base=rnd()<.2?rr(.2,.5):rr(.66,1);
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      if(rnd()<.08)continue;
      var br=rnd()<.22?.98:Math.min(1,base+rr(-.12,.22));
      bandCtx.fillStyle="rgba(245,249,255,"+br.toFixed(2)+")";
      bandCtx.fillRect(px+y*gapY,py+x*gapX,Math.max(.9,gapY*.6),Math.max(.9,gapX*.6));
    }
  }else if(c.kind==="bars"){
    var n=Math.round(rr(2,5));
    for(var b=0;b<n;b++){
      var ln=w*rr(.4,.95);
      bandCtx.fillStyle="rgba(240,246,255,"+rr(.5,.98).toFixed(2)+")";
      bandCtx.fillRect(-h/2+b*(h/n)+.5,-w/2+rnd()*(w-ln),Math.max(1,h/n*.4),ln);
    }
  }else if(c.kind==="text"){
    bandCtx.font="6px monospace";
    bandCtx.textBaseline="middle";bandCtx.textAlign="center";
    bandCtx.fillStyle="rgba(232,242,255,.75)";
    var s="";for(var t2=0;t2<Math.round(rr(3,6));t2++)s+=HEX[Math.floor(rnd()*16)];
    bandCtx.save();bandCtx.rotate(Math.PI/2);bandCtx.fillText(s,0,0);bandCtx.restore();
    bandCtx.textAlign="left";
  }else if(c.kind==="tick"){
    bandCtx.fillStyle="rgba(220,234,252,.6)";
    for(var k=0;k<8;k++)bandCtx.fillRect(-h/2,-w/2+k*(w/7),h,.8);
  }
  bandCtx.restore();
}
function animBand(dt){
  var budget=Math.round(30*dt*60/6);
  for(var k=0;k<budget;k++){
    var i=Math.floor(rnd()*COLS),r=Math.floor(rnd()*ROWS);
    var g=cellGeom(i,r);
    var arcW=TAU*g.rm/COLS;
    bandCtx.save();
    bandCtx.globalCompositeOperation="destination-out";
    bandCtx.translate(bandS/2,bandS/2);
    bandCtx.rotate(g.a);
    var r0=g.rm-BW/ROWS*.58,r1=g.rm+BW/ROWS*.58;
    var dth=(arcW*1.1)/g.rm;
    bandCtx.beginPath();
    bandCtx.arc(0,0,r1,-dth/2,dth/2);
    bandCtx.arc(0,0,r0,dth/2,-dth/2,true);
    bandCtx.closePath();
    bandCtx.fill();
    bandCtx.restore();
    paintCell(i,r);
  }
}

/* ================= sprites ================= */
function makeGlow(c){
  var s=128,k=document.createElement("canvas");k.width=s;k.height=s;
  var g=k.getContext("2d"),st,rg=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  for(st=0;st<=1.001;st+=.1)rg.addColorStop(st,"rgba("+c+","+Math.pow(1-st,2.8).toFixed(3)+")");
  g.fillStyle=rg;g.fillRect(0,0,s,s);
  return k;
}
function makeFlare(){
  var w=256,h=64,k=document.createElement("canvas");k.width=w;k.height=h;
  var g=k.getContext("2d");
  var lg=g.createLinearGradient(0,0,w,0);
  lg.addColorStop(0,"rgba(255,255,255,0)");
  lg.addColorStop(.3,"rgba(210,232,255,.5)");
  lg.addColorStop(.5,"rgba(255,255,255,1)");
  lg.addColorStop(.7,"rgba(210,232,255,.5)");
  lg.addColorStop(1,"rgba(255,255,255,0)");
  g.fillStyle=lg;g.fillRect(0,h*.42,w,h*.16);
  var rg=g.createRadialGradient(w/2,h/2,0,w/2,h/2,h/2);
  rg.addColorStop(0,"rgba(255,255,255,.9)");
  rg.addColorStop(.4,"rgba(200,226,255,.35)");
  rg.addColorStop(1,"rgba(200,226,255,0)");
  g.globalCompositeOperation="lighter";
  g.fillStyle=rg;g.fillRect(0,0,w,h);
  return k;
}
var spWhite,spWarm,spCool,spFlare;

/* ================= main layer ================= */
var rot=0,rings=[];
function drawMain(dt){
  mnc.clearRect(0,0,W,H);
  var ox=CX+par.x*14,oy=CY+par.y*14;
  rot+=dt*(.05+warp*.045);
  mnc.save();
  mnc.translate(ox,oy);
  mnc.scale(1,.94);
  /* band body */
  mnc.beginPath();
  mnc.arc(0,0,ROUT,0,TAU);mnc.arc(0,0,RIN,0,TAU,true);
  mnc.fillStyle="rgba(1,2,3,.99)";mnc.fill();
  /* ball */
  mnc.save();
  mnc.beginPath();mnc.arc(0,0,RIN-1,0,TAU);mnc.clip();
  mnc.globalCompositeOperation="lighter";
  mnc.rotate(rot*.5);
  mnc.globalAlpha=1;
  mnc.drawImage(ballTex,-RIN,-RIN,RIN*2,RIN*2);
  mnc.rotate(-rot*1.1);
  mnc.globalAlpha=.62;
  mnc.drawImage(ballTex2,-RIN,-RIN,RIN*2,RIN*2);
  mnc.rotate(rot*.35);
  mnc.globalAlpha=.4;
  mnc.drawImage(ballTex,-RIN*1.03,-RIN*1.03,RIN*2.06,RIN*2.06);
  mnc.globalAlpha=1;
  /* hot core flicker */
  var fl=.8+.2*Math.sin(time*7)+.1*Math.sin(time*17);
  mnc.globalAlpha=.4*fl;
  mnc.drawImage(spWhite,-RIN*.09,-RIN*.09,RIN*.18,RIN*.18);
  mnc.globalAlpha=1;
  mnc.restore();
  /* band texture */
  mnc.save();
  mnc.rotate(-rot);
  mnc.drawImage(bandTex,-bandS/2,-bandS/2,bandS,bandS);
  mnc.restore();
  /* rims */
  mnc.globalCompositeOperation="lighter";
  mnc.strokeStyle="rgba(244,250,255,.8)";mnc.lineWidth=1.3;
  mnc.beginPath();mnc.arc(0,0,RIN+1,0,TAU);mnc.stroke();
  mnc.strokeStyle="rgba(180,210,245,.3)";mnc.lineWidth=1;
  mnc.beginPath();mnc.arc(0,0,ROUT-1,0,TAU);mnc.stroke();
  var tk=Math.round(TAU*RIN/10),q2;
  mnc.strokeStyle="rgba(232,242,255,.5)";mnc.lineWidth=1;
  mnc.beginPath();
  for(q2=0;q2<tk;q2++){
    var ta2=q2*(TAU/tk)-rot*1.3,l2=(q2%9===0)?BW*.16:BW*.07;
    mnc.moveTo(Math.cos(ta2)*(RIN+2.5),Math.sin(ta2)*(RIN+2.5));
    mnc.lineTo(Math.cos(ta2)*(RIN+2.5+l2),Math.sin(ta2)*(RIN+2.5+l2));
  }
  mnc.stroke();
  /* two comets riding the inner rim + anamorphic flares */
  for(var q=0;q<2;q++){
    var aa=rot*2.1+q*2.6;
    var cx=Math.cos(aa)*RIN*.97,cy=Math.sin(aa)*RIN*.97;
    var fs=90+warp*70;
    mnc.globalAlpha=.55+.35*Math.sin(time*3+q);
    mnc.drawImage(spFlare,cx-fs,cy-fs*.16,fs*2,fs*.32);
    mnc.globalAlpha=1;
    var grd=mnc.createRadialGradient(cx,cy,0,cx,cy,44);
    grd.addColorStop(0,"rgba(255,255,255,1)");
    grd.addColorStop(.35,"rgba(226,240,255,.6)");
    grd.addColorStop(1,"rgba(210,230,255,0)");
    mnc.fillStyle=grd;
    mnc.beginPath();mnc.arc(cx,cy,44,0,TAU);mnc.fill();
    mnc.strokeStyle="rgba(255,255,255,.9)";mnc.lineWidth=2.6;
    mnc.beginPath();mnc.arc(0,0,RIN*.97,aa-.3,aa);mnc.stroke();
  }
  /* convergence bloom along the outer edge where streaks leave the band */
  var bl=mnc.createRadialGradient(ROUT*.985*Math.cos(-.1),ROUT*.985*Math.sin(-.1),0,
    ROUT*.985*Math.cos(-.1),ROUT*.985*Math.sin(-.1),BW*1.5);
  bl.addColorStop(0,"rgba(255,255,255,"+(.3+pulse*.2).toFixed(2)+")");
  bl.addColorStop(.4,"rgba(220,236,255,.1)");
  bl.addColorStop(1,"rgba(200,225,255,0)");
  mnc.fillStyle=bl;
  mnc.beginPath();mnc.arc(ROUT*.985*Math.cos(-.1),ROUT*.985*Math.sin(-.1),BW*1.5,0,TAU);mnc.fill();
  /* sweeping highlight along the band */
  var sw=(time*.55)%TAU;
  mnc.strokeStyle="rgba(200,228,255,.14)";mnc.lineWidth=BW*.5;
  mnc.beginPath();mnc.arc(0,0,RIN+BW*.5,sw,sw+.5);mnc.stroke();
  mnc.strokeStyle="rgba(255,255,255,.55)";mnc.lineWidth=2.2;
  mnc.beginPath();mnc.arc(0,0,RIN+1,sw,sw+.06);mnc.stroke();
  mnc.globalCompositeOperation="source-over";
  mnc.restore();
}

/* ================= front: shockwaves, dust, scan ================= */
var grains=[],scanY=0;
function buildFront(){
  grains.length=0;
  var i;
  for(i=0;i<150;i++){
    var a=rnd()*TAU,d=RIN*rr(.3,1.5);
    grains.push({x:CX+Math.cos(a)*d,y:CY+Math.sin(a)*d,vx:rr(-14,14),vy:rr(-14,14),
      s:rnd()<.14?rr(1.6,2.6):rr(.6,1.2),dim:rr(.2,.7),ph:rnd()*TAU});
  }
}
function spawnRing(){
  rings.push({r:RIN*.08,a:.34+Math.random()*.3});
}
function drawFront(dt){
  frc.clearRect(0,0,W,H);
  frc.globalCompositeOperation="lighter";
  var ox=CX+par.x*18,oy=CY+par.y*18,i;
  /* shockwaves from the core */
  charge+=dt*(.32+warp*.4);
  if(charge>1){charge=0;spawnRing();}
  for(i=rings.length-1;i>=0;i--){
    var rg=rings[i];
    rg.r+=(120+warp*260)*dt;
    rg.a-=dt*(.34+warp*.1);
    if(rg.a<=0||rg.r>RIN*1.35){rings.splice(i,1);continue;}
    var rgA=Math.max(0,rg.a),rgB=rgA*.45;
    var rgr=frc.createRadialGradient(ox,oy,Math.max(0,rg.r-RIN*.1),ox,oy,rg.r+RIN*.06);
    rgr.addColorStop(0,"rgba(190,220,255,0)");
    rgr.addColorStop(.72,"rgba(226,240,255,"+rgA.toFixed(3)+")");
    rgr.addColorStop(1,"rgba(200,226,255,0)");
    frc.fillStyle=rgr;
    frc.beginPath();frc.arc(ox,oy,rg.r+RIN*.06,0,TAU);frc.fill();
    frc.globalAlpha=rgB;
    frc.drawImage(spWhite,ox-rg.r*.5,oy-rg.r*.5,rg.r,rg.r);
    frc.globalAlpha=1;
  }
  /* dust */
  for(i=0;i<grains.length;i++){
    var g=grains[i];
    g.x+=g.vx*dt*warp;g.y+=g.vy*dt*warp;
    if(g.x<-20||g.x>W+20||g.y<-20||g.y>H+20){
      var a2=rnd()*TAU,d2=RIN*rr(.3,1.3);
      g.x=ox+Math.cos(a2)*d2;g.y=oy+Math.sin(a2)*d2;
    }
    frc.fillStyle="rgba(222,238,255,"+(g.dim*(.3+.7*Math.abs(Math.sin(time*2+g.ph)))).toFixed(3)+")";
    frc.fillRect(g.x,g.y,g.s,g.s);
  }
  /* inspection scan band: soft, no hard edge */
  scanY+=dt*(46+warp*110);
  if(scanY>H+90)scanY=-90;
  var sg=frc.createLinearGradient(0,scanY-70,0,scanY+70);
  sg.addColorStop(0,"rgba(180,215,255,0)");
  sg.addColorStop(.5,"rgba(200,225,255,.05)");
  sg.addColorStop(1,"rgba(180,215,255,0)");
  frc.fillStyle=sg;frc.fillRect(0,scanY-70,W,140);
  /* tight warm/cool accents, not a wash */
  var acc=Math.min(W,H)*.42;
  frc.globalAlpha=.26;
  frc.drawImage(spWarm,W*.72,H*.06,acc,acc);
  frc.globalAlpha=.2;
  frc.drawImage(spCool,-acc*.2,H*.62,acc,acc);
  frc.globalAlpha=1;
  frc.globalCompositeOperation="source-over";
}

/* ================= bloom ================= */
function drawBloom(){
  glc.clearRect(0,0,W,H);
  glc.globalAlpha=.9;
  glc.drawImage(MN[0],0,0,W,H);
  glc.globalAlpha=.45;
  glc.drawImage(TR[0],0,0,W,H);
  glc.globalAlpha=1;
  hlc.clearRect(0,0,W,H);
  hlc.globalAlpha=.8;
  hlc.drawImage(MN[0],0,0,W,H);
  hlc.globalAlpha=1;
}

/* ================= layout & loop ================= */
function layout(){
  W=window.innerWidth;H=window.innerHeight;
  [[TR,DPR],[MN,DPR],[FR,DPR]].forEach(function(o){
    o[0][0].width=Math.round(W*o[1]);o[0][0].height=Math.round(H*o[1]);
    o[1]&&o[0][1].setTransform(o[1],0,0,o[1],0,0);
  });
  var gs=.42;
  [GL,HL].forEach(function(o){
    o[0].width=Math.round(W*gs);o[0].height=Math.round(H*gs);
    o[1].setTransform(gs,0,0,gs,0,0);
  });
  CX=-W*.30;CY=H*.5;
  R=W*.72;
  BW=Math.max(70,W*.17);RIN=R;ROUT=R+BW;
  seed=770031;
  spWhite=makeGlow("255,255,255");
  spWarm=makeGlow("255,170,140");
  spCool=makeGlow("150,190,255");
  spFlare=makeFlare();
  buildParts();buildBall();buildBand();buildFront();
  trc.clearRect(0,0,W,H);
}
var surge=0,surgeT=rr(3,6);
function frame(ts){
  if(!last)last=ts;
  var dt=Math.min(.05,(ts-last)/1000);last=ts;
  time+=dt;pulse*=.94;
  par.x+=(par.tx-par.x)*.06;par.y+=(par.ty-par.y)*.06;
  /* hyperspeed surges: warp ramps up, holds, decays */
  surgeT-=dt;
  if(surgeT<=0){surge=1;surgeT=rr(4.5,9);}
  if(surge>0){surge=Math.max(0,surge-dt*.34);}
  var target=1+surge*surge*4.2;
  warp+=(target-warp)*Math.min(1,dt*3.4);
  document.getElementById("g3").textContent=warp.toFixed(2);
  flashEl.style.opacity=(surge>.72?(surge-.72)*.9:0).toFixed(3);
  drawTrail(dt);
  animBand(dt);
  drawMain(dt);
  drawFront(dt);
  drawBloom();
  requestAnimationFrame(frame);
}

/* ================= hud numbers ================= */
var vT=document.getElementById("v-tasks"),vA=document.getElementById("v-agents"),
    vN=document.getElementById("v-net"),vR=document.getElementById("v-rev"),
    vP=document.getElementById("v-pb"),g1=document.getElementById("g1"),g2=document.getElementById("g2");
setInterval(function(){
  vT.textContent=64+Math.floor(Math.random()*4);
  vA.textContent=12+Math.floor(Math.random()*2);
  vN.textContent=11+Math.floor(Math.random()*2);
  vR.textContent=26+Math.floor(Math.random()*6);
  g1.textContent="0x"+Math.floor(Math.random()*65535).toString(16).toUpperCase();
  g2.textContent=(3.4+Math.random()*2.6).toFixed(1);
},1500);
(function(){
  var gc=document.getElementById("grain");gc.width=170;gc.height=170;
  var ctx=gc.getContext("2d"),img=ctx.createImageData(170,170);
  for(var i=0;i<img.data.length;i+=4){
    var v=Math.random()*255;
    img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
})();
window.addEventListener("mousemove",function(e){
  par.tx=(e.clientX/W-.5)*2;par.ty=(e.clientY/H-.5)*2;
});
window.addEventListener("pointerdown",function(){
  pulse=1.6;surge=Math.min(1.2,surge+.8);spawnRing();
});
window.addEventListener("touchmove",function(e){
  var t=e.touches[0];if(!t)return;
  par.tx=(t.clientX/W-.5)*2;par.ty=(t.clientY/H-.5)*2;
},{passive:true});
var rz;
window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(layout,180);});
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){last=0;requestAnimationFrame(frame);}
});
layout();
requestAnimationFrame(frame);
})();
</script></body></html>
